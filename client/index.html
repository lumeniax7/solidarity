<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0e5b49" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" href="%BASE_URL%icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%BASE_URL%icon.svg" />
    <meta name="description" content="Caisse Familiale — gestion simple, transparente et solidaire des cotisations familiales." />
    <link rel="manifest" href="%BASE_URL%manifest.json" />
    <script>
      try {
        const theme = localStorage.getItem("caisse-theme");
        document.documentElement.classList.toggle("dark", theme === "dark");
        document.documentElement.style.colorScheme = theme === "dark" ? "dark" : "light";
        const themeColor = document.querySelector('meta[name="theme-color"]');
        if (themeColor) themeColor.content = theme === "dark" ? "#0b1517" : "#0e5b49";
      } catch {
        document.documentElement.classList.remove("dark");
        document.documentElement.style.colorScheme = "light";
      }
    </script>
    <link rel="preload" href="%BASE_URL%fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="%BASE_URL%fonts/playfair-latin.woff2" as="font" type="font/woff2" crossorigin />
    <title>Caisse Familiale</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script type="module">
      const endpoint = import.meta.env.VITE_ANALYTICS_ENDPOINT;
      const websiteId = import.meta.env.VITE_ANALYTICS_WEBSITE_ID;
      if (endpoint && websiteId) {
        const analytics = document.createElement("script");
        analytics.defer = true;
        analytics.src = `${endpoint.replace(/\/$/, "")}/umami`;
        analytics.dataset.websiteId = websiteId;
        document.head.append(analytics);
      }
    </script>
  </body>
</html>
